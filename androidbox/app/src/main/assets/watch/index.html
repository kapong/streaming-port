<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Watch the TV</title>
  <link rel="stylesheet" href="/share.css">
  <link rel="stylesheet" href="/watch.css">
  <script src="/watch.js" defer></script>
</head>
<body>
  <main class="wide">
    <div class="brand"><span class="mark" aria-hidden="true"><i></i><i></i><i></i><i></i></span>StreamPort
      <span class="places" id="viewers" hidden></span></div>
    <h1>Watching <span id="tv">the TV</span></h1>
    <div class="rule" aria-hidden="true"></div>

    <div class="card">
      <div class="stage" id="stage">
        <video id="video" muted autoplay playsinline></video>
      </div>
      <p id="status" class="status wait" role="status" aria-live="polite">Connecting</p>
      <p id="detail" class="detail"></p>
      <div class="row">
        <button id="full" class="btn">Full screen</button>
        <a id="share" class="btn link" href="/" hidden>Share to TV</a>
      </div>
    </div>

    <details>
      <summary>Not working?</summary>
      <ul>
        <li>Video only: the TV's sound isn't sent.</li>
        <li>Keep this device on the TV's Wi-Fi; watching doesn't work from other networks.</li>
        <li>"TV busy": every viewer place is taken. The page tries again by itself.</li>
      </ul>
    </details>
    <footer id="footer"></footer>
  </main>
</body>
</html>
