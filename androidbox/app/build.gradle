plugins { id 'com.android.application' }

android {
    namespace 'com.nailem.streamport'
    compileSdk 34

    defaultConfig {
        applicationId 'com.nailem.streamport'
        minSdk 30
        targetSdk 34
        versionCode 3
        versionName '1.2'
        // The box's userland is 32-bit ARM only; shipping the other ABIs of libwebrtc would add 37 MB for nothing.
        ndk { abiFilters 'armeabi-v7a' }
    }

    // Release key from ~/.gradle/gradle.properties (STREAMPORT_KEYSTORE, STREAMPORT_KEYSTORE_PASSWORD,
    // STREAMPORT_KEY_ALIAS), never from this repository. Without it a release build is signed with the debug key,
    // which installs fine but can't update an APK from the GitHub releases.
    signingConfigs {
        release {
            if (project.hasProperty('STREAMPORT_KEYSTORE')) {
                storeFile file(STREAMPORT_KEYSTORE)
                storePassword STREAMPORT_KEYSTORE_PASSWORD
                keyAlias STREAMPORT_KEY_ALIAS
                keyPassword STREAMPORT_KEYSTORE_PASSWORD
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig project.hasProperty('STREAMPORT_KEYSTORE') ? signingConfigs.release : signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    // Ed25519 signatures and X25519 key agreement for legacy AirPlay pairing. Android 11 has neither in its
    // platform crypto. Both are small pure-Java libraries with no dependencies of their own.
    implementation 'net.i2p.crypto:eddsa:0.3.0'
    implementation 'org.whispersystems:curve25519-java:0.5.0'
    // Browser sharing (WHIP): Google's WebRTC engine as built and published by Stream (Apache-2.0). Receive only:
    // ICE, DTLS-SRTP, jitter buffer, keyframe requests, hardware decoding through MediaCodec.
    implementation 'io.getstream:stream-webrtc-android:1.3.9'
    // QR code with the share address on the TV's idle screen (Apache-2.0, pure Java; R8 keeps the encoder only).
    implementation 'com.google.zxing:core:3.5.3'
    testImplementation 'junit:junit:4.13.2'
}
